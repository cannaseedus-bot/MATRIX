<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#020507"/>

  <!-- Matrix grid / scanlines -->
  <defs>
    <pattern id="grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" stroke="#0C1C16" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="matrixGlow" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF88" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#00FF88" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(256 256) scale(180)">
      <stop offset="0" stop-color="#00FF88" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grid overlay -->
  <rect width="512" height="512" fill="url(#grid)" opacity="0.45"/>
  <rect width="512" height="512" fill="url(#matrixGlow)" opacity="0.6"/>

  <!-- Central glow -->
  <circle cx="256" cy="256" r="190" fill="url(#coreGlow)"/>

  <!-- Atom orbits -->
  <g transform="translate(256 256)">
    <!-- Outer orbit -->
    <ellipse rx="160" ry="90"
      stroke="#00FF88" stroke-width="10"
      fill="none"
      transform="rotate(-18)"
      stroke-linecap="round"
      stroke-opacity="0.95"/>
    <!-- Middle orbit -->
    <ellipse rx="130" ry="70"
      stroke="#00B86A" stroke-width="9"
      fill="none"
      transform="rotate(32)"
      stroke-linecap="round"
      stroke-opacity="0.95"/>
    <!-- Inner orbit -->
    <ellipse rx="100" ry="50"
      stroke="#00FFAA" stroke-width="8"
      fill="none"
      transform="rotate(78)"
      stroke-linecap="round"
      stroke-opacity="0.95"/>

    <!-- Nucleus -->
    <circle r="32" fill="#000000" stroke="#00FF88" stroke-width="5"/>
    <circle r="16" fill="#00FF88"/>
  </g>

  <!-- Electrons -->
  <g transform="translate(256 256)">
    <!-- Electron 1 -->
    <circle cx="140" cy="-20" r="10" fill="#00FF88"/>
    <circle cx="140" cy="-20" r="18" stroke="#00FF88" stroke-width="2" opacity="0.5"/>
    <!-- Electron 2 -->
    <circle cx="-40" cy="80" r="10" fill="#00FF88"/>
    <circle cx="-40" cy="80" r="18" stroke="#00FF88" stroke-width="2" opacity="0.5"/>
    <!-- Electron 3 -->
    <circle cx="-110" cy="-70" r="10" fill="#00FF88"/>
    <circle cx="-110" cy="-70" r="18" stroke="#00FF88" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Matrix code rain columns -->
  <g font-family="monospace" font-size="18" fill="#00FF88">
    <!-- Col 1 -->
    <text x="70"  y="70"  opacity="0.15">1010</text>
    <text x="70"  y="110" opacity="0.25">ASX</text>
    <text x="70"  y="150" opacity="0.4">0110</text>
    <text x="70"  y="190" opacity="0.2">⚛</text>
    <text x="70"  y="230" opacity="0.35">0101</text>
    <text x="70"  y="270" opacity="0.2">XS A</text>

    <!-- Col 2 -->
    <text x="140" y="40"  opacity="0.25">011010</text>
    <text x="140" y="80"  opacity="0.4">AS⚛</text>
    <text x="140" y="120" opacity="0.2">0011</text>
    <text x="140" y="160" opacity="0.35">SX</text>
    <text x="140" y="200" opacity="0.18">0101</text>
    <text x="140" y="240" opacity="0.3">AX</text>

    <!-- Col 3 -->
    <text x="372" y="110" opacity="0.2">1011</text>
    <text x="372" y="150" opacity="0.35">ASX</text>
    <text x="372" y="190" opacity="0.25">⚛</text>
    <text x="372" y="230" opacity="0.4">0100</text>
    <text x="372" y="270" opacity="0.18">SA</text>

    <!-- Col 4 -->
    <text x="440" y="60"  opacity="0.3">0110</text>
    <text x="440" y="100" opacity="0.2">XS</text>
    <text x="440" y="140" opacity="0.35">AS⚛</text>
    <text x="440" y="180" opacity="0.25">0010</text>
    <text x="440" y="220" opacity="0.18">AX</text>
  </g>

  <!-- ASX wordmark -->
  <g font-family="monospace" text-anchor="middle">
    <text x="256" y="410" font-size="40" fill="#00FF88" letter-spacing="6">
      ASX
    </text>
    <text x="256" y="446" font-size="20" fill="#00B86A" letter-spacing="4" opacity="0.8">
      ATOMIC  SYSTEM  EXECUTION
    </text>
  </g>

  <!-- Subtle vignette -->
  <rect width="512" height="512" fill="url(#matrixGlow)" opacity="0.35"/>
</svg>
